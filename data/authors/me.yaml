bio: "Yixuan Wang is a Ph.D. Candidate in Computer Science at Arizona State University, specializing in Human-AI Interaction, Large Language Models (LLMs), and Explainable AI (XAI). Her research focuses on AI trust calibration, uncertainty quantification, and the evaluation of machine learning systems. She has published first-author work in IEEE TVCG and the International Journal of Human-Computer Interaction, developing simulation-based frameworks in Python and PyTorch to assess interactive ML systems and XAI techniques.She also brings strong engineering experience, having built scalable research infrastructures, developed federated learning analytics systems at UIUC, and engineered data pipelines and monitoring systems as a Data Engineer Intern at Wayfair."

